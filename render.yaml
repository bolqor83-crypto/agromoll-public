# render.yaml — публичный API АгроМолл на Render (v0.8.1-B, ADR-040).
#
# Спецификация web-сервиса для Render Blueprint. Живой сервис создан через
# POST https://api.render.com/v1/services с теми же параметрами
# (srv-dbobfevf3r2c73amlng0, https://agromoll-api.onrender.com).
# БД — Neon (Postgres 16 + PostGIS, Frankfurt): Render free Postgres
# удаляется через 30 дней, поэтому БД вынесена на Neon (см. ADR-040).
# Redis не используется: демо-режим сессий в памяти — явный opt-in
# SESSION_ALLOW_IN_MEMORY=true (компромисс задокументирован в ADR-040).
services:
  - type: web
    name: agromoll-api
    runtime: node
    plan: free
    region: frankfurt # рядом с Neon aws-eu-central-1 (Frankfurt)
    # Публичное зеркало основного репо: Render без установленного
    # GitHub App не клонит приватные репозитории (v0.8.1-B, ADR-040).
    # После подключения GitHub App к Render — вернуть основной репозиторий.
    repo: https://github.com/bolqor83-crypto/agromoll-public
    branch: feature/v0.8.1-render-api
    # ВАЖНО (dep-dbobet2j…kcgu, v0.8.1-B): Render задаёт NODE_ENV=production
    # на этапе билда — pnpm 9 в этом режиме молча пропускает devDependencies
    # («devDependencies: skipped because NODE_ENV is set to production»):
    # нет turbo/nest/prisma-CLI → ERR_PNPM_RECURSIVE_EXEC «Command not found».
    # Лечение: --prod=false + env -u для NPM_CONFIG_* (их кэш-пути ломают
    # npx). rm -rf node_modules — страховка от кэша прошлых билдов.
    buildCommand: rm -rf node_modules && env -u NPM_CONFIG_CACHE -u NPM_CONFIG_STORE_DIR -u NPM_CONFIG_LOGLEVEL npx pnpm@9.15.9 install --frozen-lockfile --prod=false && npx pnpm@9.15.9 -w exec turbo run build --filter=@agromoll/api
    # Миграции — НЕ в контейнере (dep-dbobs8aj: advisory lock через
    # pooled-строку → P1002; dep-dbobthaj: секреты не видны в buildCommand
    # → P1012). Схема/сид применяются из окружения агента по direct-строке
    # (без pooler): `DATABASE_URL_DIRECT=… pnpm --filter=@agromoll/api
    # exec prisma migrate deploy` — см. ADR-040 и v0.8.1-release.md.
    # Вложенность dist/src — из `nest build` (см. apps/api/package.json `start`).
    startCommand: node apps/api/dist/src/main.js
    autoDeploy: true
    healthcheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22.14.0'
      # Pooled-строка Neon (...-pooler...neon.tech/...?sslmode=require&pgbouncer=true&connection_limit=5).
      # Секрет: задаётся через Render API/дашборд, в репо не попадает.
      - key: DATABASE_URL
        sync: false
      # Демо-режим входа (v0.8.0-C): любой телефон входит по коду «000000».
      # Для боевого запуска — удалить.
      - key: AUTH_DEMO_LOGIN
        value: 'true'
      # Демо без Redis (v0.8.1-B, ADR-040): рестарт/спин-даун сбрасывает
      # refresh-сессии (перелогин демо-кодом). Боевому запуску — Redis.
      - key: SESSION_ALLOW_IN_MEMORY
        value: 'true'
      - key: JWT_ACCESS_SECRET
        generateValue: true # случайный секрет генерирует Render
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: BOOKING_TTL_MINUTES
        value: '30'
      - key: DELIVERY_TTL_MINUTES
        value: '60'
      - key: WORK_HOURS_MONTHLY_LIMIT
        value: '60'
      - key: WORK_MONTHS_SERIES
        value: '6'
      - key: BOOKING_AUTO_CONFIRM_HOURS
        value: '24'
      - key: CORS_ORIGIN
        value: https://agromoll-web.vercel.app
