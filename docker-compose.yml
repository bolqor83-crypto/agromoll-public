# Инфраструктура разработки АгроМолл.
# PostgreSQL + PostGIS (геозоны — задел на будущее) и Redis (заложен, используется со следующих этапов).
# Переменные берутся из корневого .env (см. .env.example).

name: agromoll

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: agromoll-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agromoll}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agromoll}
      POSTGRES_DB: ${POSTGRES_DB:-agromoll}
    ports:
      - "5432:5432"
    volumes:
      - agromoll-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agromoll} -d ${POSTGRES_DB:-agromoll}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: agromoll-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - agromoll-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  agromoll-postgres:
  agromoll-redis:
