# Стек для локальной разработки: PostgreSQL + PostGIS, Redis и
# LocalStack-S3 (S3-совместимое хранилище доказательств и фото,
# v0.7.0-B, ADR-036).
#
# Почему LocalStack, а не MinIO: MinIO ушёл с Docker Hub (октябрь 2025,
# репозиторий заархивирован в феврале 2026) — образ minio/minio больше
# не скачать анонимно. LocalStack — S3-совместимый шлюз.
#
# Почему именно 4.14.0: с 2026.03.0 LocalStack требует LOCALSTACK_AUTH_TOKEN
# даже для community-функций (аккаунт + лицензия на каждый CI-запуск).
# 4.14.0 (26.02.2026) — последний свободный community-релиз, пин — осознанное
# решение (безопасность за счёт обновлений), пересмотреть при смене
# тестового S3-двойника. Код приложения одинаков для LocalStack/AWS/R2/Yandex:
# меняется только S3_ENDPOINT (ADR-036).
#
# Бакет создаётся сам при старте API (StorageService.configureFromEnv).
# Посмотреть файлы локально:
#   aws --endpoint-url=http://localhost:4566 s3 ls s3://agromoll-evidence
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: agromoll-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agromoll
      POSTGRES_PASSWORD: agromoll
      POSTGRES_DB: agromoll
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agromoll -d agromoll']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: agromoll-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-совместимое хранилище для локальной разработки и e2e (ADR-036).
  # Прод — любой S3-провайдер (AWS/R2/Yandex): код одинаков, меняется конфиг.
  s3:
    image: localstack/localstack:4.14.0
    container_name: agromoll-s3
    restart: unless-stopped
    environment:
      # Только S3-сервис — быстрее старт, меньше памяти.
      SERVICES: s3
      # Кредиты LocalStack не проверяет, но SDK требует непустые.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - '4566:4566' # единый шлюз (S3-API; presigned PUT/GET идут сюда)
    volumes:
      - s3data:/var/lib/localstack
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:4566/_localstack/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  redisdata:
  s3data:
