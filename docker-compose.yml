# Стек для локальной разработки: PostgreSQL + PostGIS и Redis.
# Redis на этом этапе не используется приложением — заложен на будущее (ADR-001).
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: agromoll-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agromoll
      POSTGRES_PASSWORD: agromoll
      POSTGRES_DB: agromoll
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agromoll -d agromoll']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: agromoll-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
