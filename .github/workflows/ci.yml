name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint / typecheck / test / e2e / build
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: '1'
      # e2e-тесты api работают с реальной БД и Redis (service-контейнеры ниже).
      DATABASE_URL: postgresql://agromoll:agromoll@localhost:5432/agromoll?schema=public
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: agromoll
          POSTGRES_PASSWORD: agromoll
          POSTGRES_DB: agromoll
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agromoll -d agromoll"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установка pnpm
        uses: pnpm/action-setup@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Prisma Client (db:generate)
        run: pnpm turbo run db:generate

      - name: Миграции к БД service-контейнера (e2e)
        run: pnpm --filter @agromoll/api exec prisma migrate deploy

      - name: Build
        run: pnpm turbo run build

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Test (unit)
        run: pnpm turbo run test

      - name: Test e2e (api, реальный Postgres + PostGIS + Redis)
        run: pnpm --filter @agromoll/api test:e2e

      - name: Валидация docker-compose
        run: docker compose config -q

  stack:
    name: docker compose (postgres + postgis + redis)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://agromoll:agromoll@localhost:5432/agromoll?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установка pnpm
        uses: pnpm/action-setup@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Поднимаем стек и ждём healthcheck
        run: docker compose up -d --wait

      - name: Применяем миграции (PostGIS + модель бронирования)
        run: pnpm --filter @agromoll/api exec prisma migrate deploy

      - name: Миграции в точности соответствуют schema.prisma
        working-directory: apps/api
        run: |
          DIFF=$(pnpm exec prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --script)
          echo "$DIFF"
          # PostGIS-таблицы (spatial_ref_sys и пр.) живут в схеме public,
          # но не входят в datamodel — это ожидаемо, исключаем из проверки.
          DIFF_FILTERED=$(echo "$DIFF" | grep -viE 'spatial_ref_sys|geometry_columns|geography_columns|raster_columns|raster_overviews' || true)
          if echo "$DIFF_FILTERED" | grep -qE 'CREATE|ALTER|DROP'; then
            echo "::error::Миграции не соответствуют schema.prisma — применён diff выше"
            exit 1
          fi

      - name: PostGIS установлен
        run: docker compose exec -T postgres psql -U agromoll -d agromoll -t -c "SELECT postgis_version();"

      - name: Redis отвечает
        run: docker compose exec -T redis redis-cli ping
