name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint / typecheck / test / e2e / build
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: '1'
      # e2e-тесты api работают с реальной БД, Redis и S3 (service-контейнеры ниже).
      DATABASE_URL: postgresql://agromoll:agromoll@localhost:5432/agromoll?schema=public
      REDIS_URL: redis://localhost:6379
      # S3-доказательства (v0.7.0-B, ADR-036): LocalStack-контейнер ниже
      # (MinIO ушёл с Docker Hub, ADR-036 «Выбор провайдера»), бакет
      # создаётся сам при старте приложения в e2e.
      S3_ENDPOINT: http://localhost:4566
      S3_BUCKET: agromoll-evidence
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: agromoll
          POSTGRES_PASSWORD: agromoll
          POSTGRES_DB: agromoll
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agromoll -d agromoll"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      s3:
        image: localstack/localstack:2026.10.6
        env:
          SERVICES: s3
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установка pnpm
        uses: pnpm/action-setup@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Prisma Client (db:generate)
        run: pnpm turbo run db:generate

      - name: Миграции к БД service-контейнера (e2e)
        run: pnpm --filter @agromoll/api exec prisma migrate deploy

      - name: Build
        run: pnpm turbo run build

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Test (unit)
        run: pnpm turbo run test

      - name: Test e2e (api, реальный Postgres + PostGIS + Redis + S3)
        # timeout — страховка от «утёкших» соединений (обрыв компиляции
        # модуля до app.close() оставляет открытыми ioredis/Prisma —
        # процесс jest тогда не выходит; forceExit в скрипте закрывает
        # штатные прогоны, таймаут ловит всё остальное).
        timeout-minutes: 15
        run: pnpm --filter @agromoll/api test:e2e

      - name: Валидация docker-compose
        run: docker compose config -q

  stack:
    name: docker compose (postgres + postgis + redis + s3)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://agromoll:agromoll@localhost:5432/agromoll?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установка pnpm
        uses: pnpm/action-setup@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Поднимаем стек и ждём healthcheck
        run: docker compose up -d --wait

      - name: Применяем миграции (PostGIS + модель бронирования)
        run: pnpm --filter @agromoll/api exec prisma migrate deploy

      - name: Миграции в точности соответствуют schema.prisma
        working-directory: apps/api
        run: |
          DIFF=$(pnpm exec prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --script)
          echo "$DIFF"
          # PostGIS-таблицы (spatial_ref_sys и пр.) живут в схеме public,
          # но не входят в datamodel — это ожидаемо, исключаем из проверки.
          # geo_points_geog_gist_idx — GIST-индекс PostGIS (ADR-014):
          # Prisma не описывает GIST, индекс живёт только в миграции.
          DIFF_FILTERED=$(echo "$DIFF" | grep -viE 'spatial_ref_sys|geometry_columns|geography_columns|raster_columns|raster_overviews|geo_points_geog_gist_idx' || true)
          if echo "$DIFF_FILTERED" | grep -qE 'CREATE|ALTER|DROP'; then
            echo "::error::Миграции не соответствуют schema.prisma — применён diff выше"
            exit 1
          fi

      - name: PostGIS установлен
        run: docker compose exec -T postgres psql -U agromoll -d agromoll -t -c "SELECT postgis_version();"

      - name: Redis отвечает
        run: docker compose exec -T redis redis-cli ping

      - name: S3 (LocalStack) отвечает
        run: docker compose exec -T s3 curl -sf http://localhost:4566/_localstack/health
